services:
  vibevoice:
    image: vllm/vllm-openai:latest
    container_name: vibevoice-vllm
    # Use host IPC to prevent memory crashes
    ipc: host
    ports:
      - "8072:8000"
    env_file: .env
    environment:
      - VIBEVOICE_FFMPEG_MAX_CONCURRENCY=64
      - PYTORCH_ALLOC_CONF=expandable_segments:True
    volumes:
      - .:/app
      - $HOME/.cache/huggingface:/root/.cache/huggingface
      - /dev/null:/etc/ld.so.conf.d/00-cuda-compat.conf
    # Override entrypoint to run the script
    entrypoint: bash
    command: -c "python3 /app/vllm_plugin/scripts/start_server.py"
    # GPU Configuration
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]